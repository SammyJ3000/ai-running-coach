  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <style>
    /* Floodlit: a track at night. Warm black, hi-vis yellow for "now" and the one action, scoreboard numerals. */
    :root {
      --bg: #0D0E0C; --s1: #161814; --s2: #1F221C; --line: #2B2E26; --ink: #F2F1E8; --soft: #CFCEC2; --mute: #A3A394; --dim: #74766A;
      --hi: #E1FF45; --on-hi: #11130A; --ok: #7BD88F; --warn: #F0C34E; --stop: #F26B5E;
      --num: 'Big Shoulders Display', 'Arial Narrow', sans-serif; --body: Archivo, -apple-system, system-ui, sans-serif;
      --out: cubic-bezier(.23, 1, .32, 1);
      /* Springs as CSS easings (Apple's duration + bounce model): smooth = no bounce, snap = a touch, pop = for small things that land. */
      --sp: linear(0, 0.038, 0.124, 0.231, 0.342, 0.447, 0.542, 0.626, 0.697, 0.756, 0.805, 0.845, 0.878, 0.904, 0.925, 0.941, 0.954, 0.964, 0.972, 0.979, 0.984, 0.987, 0.99, 0.992, 0.994, 0.996, 0.997, 0.997, 1);
      --sp-snap: linear(0, 0.035, 0.12, 0.23, 0.347, 0.462, 0.567, 0.66, 0.739, 0.805, 0.858, 0.899, 0.931, 0.955, 0.973, 0.986, 0.994, 1, 1.003, 1.005, 1.006, 1.006, 1.006, 1.005, 1.005, 1.004, 1.003, 1.003, 1);
      --sp-pop: linear(0, 0.029, 0.102, 0.203, 0.317, 0.434, 0.547, 0.65, 0.742, 0.82, 0.884, 0.936, 0.975, 1.004, 1.024, 1.037, 1.044, 1.046, 1.045, 1.042, 1.038, 1.032, 1.027, 1.022, 1.017, 1.013, 1.009, 1.006, 1.003, 1.001, 1, 0.999, 0.998, 0.998, 0.998, 0.998, 1);
      --hair: rgba(242,241,232,.075); --top: calc(env(safe-area-inset-top) + 22px);
    }
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); } body { color: var(--ink); font: 15px/1.4 var(--body); -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--hi); color: var(--on-hi); } input { caret-color: var(--hi); }
    /* Bottom padding = floating nav (22 + 62) + breathing room + safe area, so the last line always clears the bar. */
    .page { position: relative; max-width: 480px; margin: 0 auto; padding: var(--top) 20px calc(env(safe-area-inset-bottom) + 132px); min-height: 100dvh; }
    .page.has-cta { padding-bottom: calc(env(safe-area-inset-bottom) + 200px); }
    /* Scroll edge: content blurs and dims as it slides under the floating nav, so you see it move but can't read it through the bar. */
    .edge { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom) + 150px); pointer-events: none;
      background: linear-gradient(180deg, rgba(13,14,12,0) 0, rgba(13,14,12,.5) 36%, rgba(13,14,12,.78) 66%, rgba(13,14,12,.9) 100%);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 46%); mask-image: linear-gradient(180deg, transparent 0, #000 46%); }
    .edge.tall { height: calc(env(safe-area-inset-bottom) + 218px); -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 34%); mask-image: linear-gradient(180deg, transparent 0, #000 34%); }
    .n { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: .005em; }
    h1 { font: 900 46px/.84 var(--num); letter-spacing: .005em; text-transform: uppercase; }
    h2 { font: 600 23px/1.15 var(--body); letter-spacing: -.025em; }
    .mute { color: var(--mute); } .dim { color: var(--dim); } .soft { color: var(--soft); }
    .sub { font-size: 13.5px; color: var(--mute); margin-top: 7px; }
    .err { color: var(--stop); font-size: 13.5px; margin-top: 10px; }
    svg { display: block; overflow: visible; width: 100%; height: auto; }
    section { margin-top: 18px; }
    .rule { border-top: 1px solid var(--line); padding-top: 14px; }

    button, .btn { font: 600 16.5px var(--body); letter-spacing: -.01em; border: 0; border-radius: 26px; height: 52px; padding: 0 20px; background: var(--hi); color: var(--on-hi); width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 12px; cursor: pointer; position: relative; -webkit-user-select: none; user-select: none; touch-action: manipulation; transition: transform 500ms var(--sp-snap), filter 260ms ease, opacity 160ms; box-shadow: inset 0 1px 0 rgba(255,255,255,.38), inset 0 -10px 18px -10px rgba(120,140,0,.5); }
    button i, .btn i { font-size: 19px; }
    button.ghost, .btn.ghost { background: rgba(242,241,232,.035); color: var(--ink); box-shadow: inset 0 0 0 1px #3A3E33, inset 0 1px 0 rgba(242,241,232,.06); }
    /* Press: down is immediate (90 ms), release rides the spring. :active needs the touchstart listener at the bottom of the script on iOS. */
    button:active, .btn:active { transform: scale(.965); filter: brightness(.9); transition-duration: 90ms; } button:disabled { opacity: .55; }
    .tap { cursor: pointer; position: relative; -webkit-user-select: none; user-select: none; touch-action: manipulation; border-radius: 16px; transition: transform 500ms var(--sp-snap), background-color 320ms ease, box-shadow 320ms ease; }
    .tap:active { transform: scale(.982); background-color: rgba(242,241,232,.05); box-shadow: 0 0 0 9px rgba(242,241,232,.05); transition-duration: 90ms; }
    .cta { position: fixed; z-index: 5; left: 0; right: 0; margin: 0 auto; width: min(440px, calc(100% - 40px)); bottom: calc(env(safe-area-inset-bottom) + 96px); }
    input { width: 100%; font: 16px var(--body); color: var(--ink); background: var(--bg); border: 1px solid #3A3E33; border-radius: 14px; padding: 13px 14px; margin-top: 6px; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
    label { display: block; margin-top: 12px; font-size: 13.5px; color: var(--mute); }

    /* Floating glass nav: content scrolls and blurs underneath; the lit pill slides between tabs on a spring. */
    .tabs { position: fixed; z-index: 6; left: 0; right: 0; margin: 0 auto; bottom: calc(env(safe-area-inset-bottom) + 22px); height: 62px; width: 300px; border-radius: 31px; 
      background: linear-gradient(180deg, rgba(48,52,42,.6), rgba(26,28,23,.66)); -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%); border: 1px solid rgba(242,241,232,.1);
      box-shadow: inset 0 1px 0 rgba(242,241,232,.13), inset 0 -1px 0 rgba(0,0,0,.3), 0 18px 44px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 0 6px; }
    .tabs .pill { position: absolute; left: 6px; top: 5px; height: 50px; width: calc((100% - 12px) / 4); border-radius: 25px; background: linear-gradient(180deg, rgba(242,241,232,.15), rgba(242,241,232,.07)); box-shadow: inset 0 1px 0 rgba(242,241,232,.14); transition: transform 520ms var(--sp-snap); }
    .tabs a { position: relative; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--dim); height: 50px; align-content: center; border-radius: 25px; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; transition: transform 500ms var(--sp-snap), color 220ms ease; }
    .tabs a:active { transform: scale(.9); transition-duration: 90ms; } .tabs i { font-size: 22px; } .tabs .on { color: var(--ink); } .tabs .on i { animation: pop 560ms var(--sp-pop) both; }
    @keyframes pop { from { transform: scale(.72) translateY(2px); } }
    /* iOS haptic: an invisible label over the control, wired to a hidden switch. A real finger toggling a switch is the only haptic Safari gives a web page. */
    .tick { position: absolute; inset: 0; touch-action: manipulation; border-radius: inherit; cursor: pointer; } .tick input { position: absolute; width: 1px; height: 1px; margin: 0; visibility: hidden; }

    .top { display: flex; justify-content: space-between; align-items: flex-end; }
    .wk { display: flex; gap: 3px; } .wk div { width: 26px; text-align: center; position: relative; padding-bottom: 7px; }
    .wk b { display: block; font-size: 10.5px; font-weight: 500; color: var(--dim); margin-bottom: 3px; }
    .wk span { display: grid; place-items: center; height: 26px; border-radius: 13px; font: 700 17px var(--num); }
    .wk .past span { color: var(--dim); } .wk .now span { background: var(--hi); color: var(--on-hi); }
    .wk em { position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: var(--mute); } .wk .now em { background: var(--hi); }

    .hero { margin-top: 26px; } .h-row { display: flex; align-items: flex-end; gap: 14px; }
    .big { font: 900 150px/.74 var(--num); letter-spacing: -.01em; margin-left: -4px; white-space: nowrap; } .big.long { font-size: 112px; } .big small { font-size: .25em; font-weight: 800; margin-left: 5px; color: var(--mute); letter-spacing: .01em; }
    .h-t { padding-bottom: 1px; min-width: 0; } .h-t p { color: var(--mute); font-size: 14px; line-height: 1.35; margin-top: 4px; text-wrap: pretty; }
    .ramp { margin-top: 24px; } .ramp-l { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); margin-top: 6px; position: relative; } .ramp-l .here { position: absolute; transform: translateX(-50%); color: var(--hi); font-weight: 600; white-space: nowrap; }
    .facts { display: grid; gap: 7px; margin-top: 14px; font-size: 13.5px; color: var(--mute); } .facts div { display: flex; gap: 8px; align-items: flex-start; line-height: 1.35; } .facts i { font-size: 17px; color: var(--ink); flex: none; } .facts .shield { color: var(--ok); }
    .coach { margin-top: 18px; padding: 14px 0 13px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .coach p { font-size: 16.5px; line-height: 1.36; letter-spacing: -.015em; text-wrap: pretty; } .coach span { font-size: 12px; display: block; margin-top: 3px; color: var(--dim); }
    .g-h { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; } .g-n { font-size: 38px; line-height: .85; }
    .g-gap { font-size: 12.5px; color: var(--mute); padding-bottom: 1px; } .g-gap .n { font-size: 19px; color: var(--ink); margin-right: 2px; }
    .k-t { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; } .k-t b { font-weight: 600; } .k-t span { text-align: right; }
    .lv-ok { color: var(--ok); } .lv-easy { color: var(--warn); } .lv-stop { color: var(--stop); }
    .k-s { display: flex; gap: 3px; margin-top: 8px; position: relative; } .k-s i { height: 8px; border-radius: 4px; } .k-s .a { background: var(--ok); flex: 3; } .k-s .b { background: var(--warn); flex: 2; } .k-s .c { background: var(--stop); flex: 6; }
    .k-s i { transition: opacity 500ms ease; } .k-s.at-a .b, .k-s.at-a .c, .k-s.at-b .a, .k-s.at-b .c, .k-s.at-c .a, .k-s.at-c .b { opacity: .34; }
    .k-s u { position: absolute; top: -5px; width: 18px; height: 18px; margin-left: -9px; border-radius: 9px; background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    .k-l { display: flex; gap: 3px; font-size: 12px; line-height: 1.25; color: var(--mute); margin-top: 6px; } .k-l span:nth-child(1) { flex: 3; } .k-l span:nth-child(2) { flex: 2; } .k-l span:nth-child(3) { flex: 6; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 10px; padding: 10px 0 9px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); } .stats.four { grid-template-columns: repeat(4, 1fr); }
    .stats b { font: 800 26px/1 var(--num); display: block; } .stats span { font-size: 12px; color: var(--mute); }
    .last h4, .h4 { font-size: 14.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; } .h4 span, .last h4 span { font-size: 12.5px; font-weight: 400; color: var(--mute); }
    .last .stats { margin-top: 8px; border: 0; padding: 4px 0 0; } .last .said { margin-top: 12px; padding-top: 0; border-top: 0; } .last p { font-size: 14px; margin-top: 9px; color: var(--soft); line-height: 1.4; }

    /* Session pieces: the steps as a shape, the limits as scoreboard numbers, the small print behind a tap. */
    .prof { margin-top: 22px; } .prof-l { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--mute); margin-top: 7px; line-height: 1.25; } .prof-l b { color: var(--ink); font-weight: 600; } .prof-l span:last-child { text-align: right; } .prof-l span:only-child { text-align: left; }
    .hero .stats, .sheet .hero .stats { margin-top: 14px; } .stats b { white-space: nowrap; } @media (max-width: 350px) { .hero .stats b { font-size: 22px; } }
    .stats b small { font: 500 12px var(--body); color: var(--mute); margin-left: 3px; letter-spacing: 0; }
    .lines { display: grid; gap: 9px; margin-top: 13px; font-size: 14px; color: var(--soft); } .lines div { display: grid; grid-template-columns: 18px 1fr; gap: 9px; line-height: 1.36; text-wrap: pretty; } .lines i { font-size: 17px; color: var(--mute); margin-top: 1px; } .lines b { color: var(--ink); font-weight: 600; }
    .lines .pre { color: var(--warn); } .lines .pre i { color: var(--warn); } .lines .cue-l { color: var(--mute); } .lines .cue-l i { color: var(--hi); } .lines .no i { color: var(--dim); }
    .more { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; padding: 12px 0 0; border-top: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; } .more span { color: var(--mute); font-weight: 400; font-size: 13px; margin-left: auto; margin-right: 8px; } .more i { font-size: 15px; color: var(--mute); transition: transform 220ms var(--out); } .more.open i { transform: rotate(180deg); }
    .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 260ms var(--out), opacity 200ms ease; opacity: 0; } .fold > div { overflow: hidden; min-height: 0; } .fold.open { grid-template-rows: 1fr; opacity: 1; } .fold .lines { margin-top: 11px; }
    .whyp { font-size: 13.5px; color: var(--mute); line-height: 1.4; margin-top: 11px; text-wrap: pretty; } .whyp b { color: var(--soft); font-weight: 500; }
    .rest-h h2 { margin-top: 16px; } .rest-h .whyp { margin-top: 5px; font-size: 14px; }
    .done-t { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: var(--mute); margin-bottom: 16px; } .done-t b { display: flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600; } .done-t i { font-size: 17px; }
    .side { display: grid; gap: 8px; padding-bottom: 2px; } .side b { font: 800 30px/.9 var(--num); display: block; } .side span { font-size: 12px; color: var(--mute); }
    .sp { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: end; margin-top: 20px; } .sp div { text-align: center; } .sp u { display: block; border-radius: 3px; background: var(--hi); } .sp .slow u { background: repeating-linear-gradient(45deg, #3A3E33 0 1.4px, #161814 1.4px 5px); box-shadow: inset 0 0 0 1px #3A3E33; } .sp .fast b { color: var(--hi); } .sp .slow b { color: var(--mute); } .sp b { font: 700 15px var(--num); display: block; margin-top: 5px; } .sp span { font-size: 11px; color: var(--dim); display: block; }
    .said { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); } .said p { font-size: 16.5px; line-height: 1.36; letter-spacing: -.015em; text-wrap: pretty; } .said > span { font-size: 12px; display: block; margin-top: 4px; color: var(--dim); }
    .golink { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; font-weight: 500; } .golink span { color: var(--mute); font-weight: 400; font-size: 13px; margin-left: auto; margin-right: 8px; } .golink i { font-size: 15px; color: var(--mute); }
    .nx-r { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin-top: 10px; } .nx-r .d { font: 800 46px/.84 var(--num); } .nx-r .d small { font: 500 12px var(--body); color: var(--mute); margin-left: 3px; } .nx-r h3 { font-size: 16.5px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; } .nx-r p { font-size: 13px; color: var(--mute); margin-top: 2px; } .nx-r > i { color: var(--dim); font-size: 16px; }
    .nx .prof { margin-top: 13px; }
    .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; } .sumr { cursor: pointer; } .sumr em { font-style: normal; color: var(--ink); font-weight: 500; font-size: 13px; display: inline-block; margin-top: 3px; }
    .what .meta { color: var(--dim); } .what h3 i { color: var(--ok); font-size: 14px; margin-left: 6px; vertical-align: -1px; } .row > .go { color: #4A4E40; font-size: 13px; align-self: start; margin-top: 4px; }
    .sheet .hero { margin-top: 18px; }
    @media (prefers-reduced-motion: reduce) { .fold, .more i { transition: none; } }

    .draft { display: flex; align-items: center; gap: 6px; font-size: 12.5px; border: 1px dashed #5A5E4C; border-radius: 14px; padding: 5px 11px 5px 9px; } .draft i { font-size: 15px; }
    .mixbar { display: flex; gap: 3px; height: 10px; margin-top: 10px; } .mixbar i { background: #D9D8CC; border-radius: 5px 2px 2px 5px; } .mixbar .h { flex: 1; background: var(--hi); border-radius: 2px 5px 5px 2px; } .mixbar.all i { border-radius: 5px; }
    .mix-l { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mute); margin-top: 4px; } .mix-l b { font: 700 17px var(--num); color: var(--ink); }
    .chg { background: var(--s1); border-radius: 20px; box-shadow: inset 0 1px 0 rgba(242,241,232,.05); padding: 14px 16px 15px; }
    .chg h4 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; letter-spacing: -.01em; } .chg h4 i { color: var(--ok); font-size: 17px; } .chg p { font-size: 13px; color: var(--soft); line-height: 1.35; margin-top: 7px; }
    .wkh { display: flex; align-items: baseline; gap: 8px; margin-top: 20px; padding-bottom: 6px; border-bottom: 1px solid var(--line); } .wkh b { font-size: 14.5px; font-weight: 600; } .wkh .t { margin-left: auto; font: 700 17px var(--num); white-space: nowrap; }
    .focus { font-size: 12.5px; color: var(--dim); margin-top: 6px; }
    .row { display: grid; grid-template-columns: 30px 14px 1fr auto 12px; gap: 8px; padding: 9px 0 0; }
    .when { text-align: center; } .when b { display: block; font-size: 10.5px; font-weight: 500; color: var(--dim); line-height: 1.1; } .when span { font: 700 22px/1 var(--num); }
    .rail { position: relative; } .rail:before { content: ""; position: absolute; left: 6px; top: -9px; bottom: -1px; width: 2px; background: var(--line); } .rail i { position: absolute; left: 2px; top: 5px; width: 10px; height: 10px; border-radius: 5px; background: var(--bg); border: 2px solid #D9D8CC; }
    .row.now .rail i { background: var(--hi); border-color: var(--hi); outline: 4px solid rgba(225,255,69,.18); } .row.hard .rail i { border-color: var(--hi); } .row.rest .rail i { border-color: #4A4E40; width: 6px; height: 6px; left: 4px; top: 8px; }
    .row.rest h3, .row.rest .when span { color: var(--dim); font-weight: 500; }
    .what h3 { font-size: 15px; font-weight: 600; letter-spacing: -.015em; line-height: 1.25; } .what h3 em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--hi); margin-left: 8px; }
    .what p { font-size: 12.5px; color: var(--mute); line-height: 1.32; margin-top: 1px; } .what .why { color: var(--dim); } .what .why i { color: var(--ok); font-size: 13px; margin-right: 4px; vertical-align: -1px; }
    .km { text-align: right; min-width: 34px; display: flex; align-items: baseline; gap: 3px; justify-content: flex-end; } .km span { font: 800 26px/1.1 var(--num); } .km small { font-size: 11px; color: var(--dim); }

const t = (s) => (s == null ? '–' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`);
const pace = (s) => (s ? `${t(s)}/km` : '–');
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const dayName = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
const dayNum = (d) => new Date(d + 'T12:00:00').getDate();

function Setup({ onDone }) {
  const [k, setK] = useState('');
  return <main className="page"><div className="setup"><div className="n">COACH</div><p>Type the app's passphrase once. It stays on this phone.</p>
    <input type="password" value={k} onChange={(e) => setK(e.target.value)} placeholder="Passphrase" />
    <button onClick={() => { localStorage.setItem(KEY, k.trim()); onDone(); }}><Tick />Continue</button></div></main>;
}

// ---- Floodlit pieces (look only; no data logic lives here) ----
const RUNNING = (s) => s && !['rest', 'cross'].includes(s.type);
const HARD = /tempo|interval|test/;
// Where a session type sits on the 10-step effort ramp (which bars light up).
const EFFORT = { walk: [0, 1], 'walk-run': [1, 2], easy: [2, 3], long: [2, 3], strides: [3, 4], test: [5, 6], tempo: [6, 7], intervals: [7, 8] };
const kmLabel = (k) => (Number.isInteger(k) ? k : Math.round(k * 10) / 10);

// The coach writes a session as prose. These read it into steps, limits and notes for display; nothing is stored.
const sentences = (x) => String(x || '').replace(/([.!?])\s+(?=[A-Z])/g, '$1\n').split('\n').map((v) => v.trim()).filter(Boolean);
const STEP = /^(brisk walk|walk|easy run|run|jog)\s+(\d+(?:\.\d+)?)\s*min\b\s*(.*)$/i;
function readSession(s) {
  const steps = [], notes = []; let open = true;
  for (const raw of sentences(s.structure)) {
    if (open) {
      const body = raw.replace(/^then\s+/i, '').replace(/[.!]$/, '');
      const rep = body.match(/^(.*?),?\s*[x×]\s?(\d+)$/i), parts = rep ? rep[1].split(/,\s*/).map((p) => p.trim().match(STEP)) : [];
      if (rep && parts.length && parts.every(Boolean)) { steps.push({ reps: +rep[2], parts: parts.map((m) => ({ run: !/walk/i.test(m[1]), min: +m[2] })) }); continue; }
      const one = body.match(STEP);
      if (one) { steps.push({ reps: 1, parts: [{ run: !/walk/i.test(one[1]), min: +one[2] }] }); if (one[3] && !/^(to finish|easy)$/i.test(one[3])) notes.push(raw); continue; }
      if (steps.length) open = false;
    }
    notes.push(raw);
  }
  const range = String(s.pace || '').match(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/);
  return { steps, pre: notes.filter((n) => /^only\b/i.test(n)), notes: notes.filter((n) => !/^only\b/i.test(n)), cue: sentences(s.cue), range: range ? `${range[1]}–${range[2]}` : null };
}
const stepName = (g, cap) => { const w = (p) => `${p.run ? 'run' : 'walk'} ${p.min}`, x = g.reps > 1 ? `${g.reps} × ${g.parts.map(w).join(', ')}` : `${w(g.parts[0])}${cap ? ' min' : ''}`; return cap ? x[0].toUpperCase() + x.slice(1) : x; };
const stepLine = (steps) => { const x = steps.map((g) => stepName(g)).join(' · '); return x ? x[0].toUpperCase() + x.slice(1) : ''; };
const noteIcon = (n) => (/heart rate|bpm/i.test(n) ? 'heartbeat' : /^no running/i.test(n) ? 'prohibit' : /^gym/i.test(n) ? 'barbell' : /film|video/i.test(n) ? 'video-camera' : /pain|limp|knee|swelling|physio|sore/i.test(n) ? 'first-aid' : /walk/i.test(n) ? 'person-simple-walk' : /stop at|km on the watch/i.test(n) ? 'watch' : 'note');
const Line = ({ n, cls }) => { const m = n.match(/^(Gym|Note):\s*(.*)$/); return <div className={`${cls || ''} ${/^no running/i.test(n) ? 'no' : ''}`}><i className={`ph ph-${noteIcon(n)}`} /><span>{m ? <><b>{m[1]}. </b>{m[2][0].toUpperCase() + m[2].slice(1)}</> : n}</span></div>; };
const daysTo = (d) => Math.round((new Date(d + 'T12:00:00') - new Date(iso() + 'T12:00:00')) / 864e5);
const inDays = (d) => { const n = daysTo(d); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`; };

// Time runs left to right, height is effort: walk low, run high.
function Profile({ steps, hot, mini, labels }) {
  const flat = steps.flatMap((g) => Array.from({ length: g.reps }, () => g.parts).flat()), total = flat.reduce((n, p) => n + p.min, 0) || 1;
  const W = 350, H = mini ? 26 : 50, gap = flat.length > 12 ? 1.5 : 2.5, per = (W - gap * (flat.length - 1)) / total; let x = 0;
  return <div className="prof">
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Session shape: ${stepLine(steps)}`}>
      {(() => { const all = flat.map((p, i) => { const w = p.min * per, h = p.run ? H : H * 0.34, r = <rect key={i} className="rise" style={{ '--i': i }} x={x} y={H - h} width={w} height={h} rx={mini ? 2 : 3} fill={p.run ? 'var(--hi)' : '#3A3E33'} />; x += w + gap; return [p.run, r]; });
        return <><g>{all.filter((a) => !a[0]).map((a) => a[1])}</g><g>{all.filter((a) => a[0]).map((a) => a[1])}</g></>; })()}
    </svg>
    {labels && <div className="prof-l">{steps.length <= 4 ? steps.map((g, i) => <span key={i}>{g.reps > 1 || g.parts[0].run ? <b>{stepName(g, true)}</b> : stepName(g, true)}</span>) : <span>{stepLine(steps)}</span>}</div>}
  </div>;
}

// The body of a running session. `fold` keeps the small print behind a tap (Today); the sheet shows it all.
function SessionBody({ s, hot, fold }) {
  const r = readSession(s), [open, setOpen] = useState(false), lit = EFFORT[s.type];
  const cueRest = r.cue.slice(fold ? 2 : 0).join(' ');
  const rest = [...(cueRest ? [['cue', cueRest]] : []), ...(s.pace && (!r.range || !fold || /,/.test(s.pace)) ? [['pace', s.pace[0].toUpperCase() + s.pace.slice(1) + (/[.!]$/.test(s.pace) ? '' : '.')]] : []), ...r.notes.map((n) => ['note', n])];
  const list = <div className="lines">{rest.map(([k, n]) => k === 'cue' ? <div key={n}><i className="ph ph-metronome" /><span>{n}</span></div> : k === 'pace' ? <div key={n}><i className="ph ph-gauge" /><span>{n}</span></div> : <Line key={n} n={n} />)}</div>;
  const why = s.why && <p className="whyp"><b>Why this run. </b>{s.why}{s.rule && ' Adjusted by the knee rules.'}</p>;
  return <>
    {r.steps.length ? <Profile steps={r.steps} hot={hot} labels /> : lit && <Ramp lit={lit} word={HARD.test(s.type) ? 'Hold it here' : 'Stay down here'} />}
    <div className="stats">
      {s.minutes != null && <div><b><Count v={s.minutes} /><small>min</small></b><span>about, all in</span></div>}
      {s.hr_cap != null && <div><b><Count v={s.hr_cap} /><small>bpm</small></b><span>stay under</span></div>}
      {r.range && <div><b>{r.range}</b><span>per km, easy</span></div>}
    </div>
    {(r.pre.length > 0 || (fold && r.cue[0])) && <div className="lines">
      {r.pre.map((n) => <div className="pre" key={n}><i className="ph ph-warning" /><span>{n}</span></div>)}
      {fold && r.cue[0] && <div className="cue-l"><i className="ph ph-metronome" /><span><b>{r.cue[0]}</b>{r.cue[1] ? ` ${r.cue[1]}` : ''}</span></div>}
    </div>}
    {fold ? <>
      <a role="button" aria-expanded={open} className={`more ${open ? 'open' : ''}`} onClick={() => setOpen(!open)}>Session notes<span>{open ? '' : 'Rules, pace and why'}</span><i className="ph-bold ph-caret-down" /></a>
      <div className={`fold ${open ? 'open' : ''}`} aria-hidden={!open}><div>{list}{why}</div></div>
    </> : <>{list}{why}</>}
  </>;
}
const kmFmt = (k) => (x) => (Number.isInteger(kmLabel(k)) ? String(Math.round(x)) : x.toFixed(1));
const BigKm = ({ s }) => (s.km != null ? <div className={`big ${String(kmLabel(s.km)).length > 1 ? 'long' : ''}`}><Count v={kmLabel(s.km)} fmt={kmFmt(s.km)} /><small>km</small></div> : s.minutes ? <div className="big long"><Count v={s.minutes} /><small>min</small></div> : null);

function RestBody({ s, fold }) {
  const all = sentences(s.structure), [open, setOpen] = useState(false), head = fold ? all.slice(0, 3) : all, tail = fold ? all.slice(3) : [];
  return <>
    <div className="lines">{head.map((n) => <Line key={n} n={n} />)}</div>
    {tail.length > 0 && <>
      <a role="button" aria-expanded={open} className={`more ${open ? 'open' : ''}`} onClick={() => setOpen(!open)}>{tail.length} more note{tail.length > 1 ? 's' : ''}<i className="ph-bold ph-caret-down" /></a>
      <div className={`fold ${open ? 'open' : ''}`} aria-hidden={!open}><div><div className="lines">{tail.map((n) => <Line key={n} n={n} />)}</div></div></div>
    </>}
  </>;
}

function SessionSheet({ s, close }) {
  const run = RUNNING(s);
  return <Sheet onClose={close}>{(close) => <>
    <div className="sh-top"><span>{new Date(s.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}{s.date >= iso() ? `, ${inDays(s.date)}` : ''}</span><a className="close" onClick={close}>Close<i className="ph-bold ph-x" /></a></div>
    {run ? <section className="hero"><div className="h-row"><BigKm s={s} /><div className="h-t"><h2>{s.title}</h2></div></div><SessionBody s={s} hot={s.date === iso()} /></section>
      : <section className="hero rest-h"><h2 style={{ marginTop: 0 }}>{s.title}</h2>{s.why && <p className="whyp">{s.why}</p>}<RestBody s={s} /></section>}
  </>}</Sheet>;
}

function Ramp({ lit, word }) {
  const [a, b] = lit, mid = ((a + b + 1) / 2) * 35.3 - 2.9;
  return <div className="ramp">
    <svg viewBox="0 0 350 56" role="img" aria-label={`Effort: ${word}`}><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#161814" /><rect width="1.4" height="5" fill="#3A3E33" /></pattern></defs>
      {Array.from({ length: 10 }, (_, i) => { const h = 12 + i * 4.6; return <rect key={i} className="rise" style={{ '--i': i }} x={i * 35.3} y={54 - h} width="29.5" height={h} rx="3" fill={i >= a && i <= b ? 'var(--hi)' : i > b ? 'url(#hatch)' : '#3A3E33'} stroke={i > b ? '#3A3E33' : 'none'} />; })}</svg>
    <div className="ramp-l"><span>{a > 1 ? 'Easy' : ''}</span><span className="here" style={{ left: `${Math.max(14, Math.min(82, (mid / 350) * 100))}%` }}>{word}</span><span>{b < 8 ? 'Not today' : ''}</span></div>
  </div>;
}

function WeekStrip({ marks }) {
  const now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return iso(d); });
  return <div className="wk" aria-label="This week">{days.map((d) => <div key={d} className={d === iso() ? 'now' : d < iso() ? 'past' : ''}><b>{dayName(d)[0]}</b><span>{dayNum(d)}</span>{marks.has(d) && <em />}</div>)}</div>;
}

function Goal({ goal, runs, coach }) {
  const best = runs.map((r) => r.est_5k_secs).filter(Boolean);
  const now = best.length ? Math.min(...best.slice(-6)) : (coach && coach.plan && coach.plan.target_now_secs) || goal.start_secs;
  const span = goal.start_secs - goal.pb_secs, done = Math.max(0, Math.min(1, (goal.start_secs - now) / span));
  // The path from the starting point to the PB: quick gains first, slower near the PB. A shape, not a forecast.
  const P = (u) => [8 + 310 * u, 10 + 48 * (1 - Math.pow(1 - u, 2.1))];
  const path = Array.from({ length: 25 }, (_, i) => P(i / 24)).map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
  const [mx, my] = P(done), upto = (u) => Array.from({ length: 13 }, (_, i) => P((u * i) / 12)).map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
  // On first view the marker travels from the starting point to where you are now, leaving a lit line behind it.
  const fresh = useContext(Fresh), mark = useRef(), trail = useRef();
  useLayoutEffect(() => {
    if (!fresh || done <= 0.02) return; let raf, t0;
    const put = (u) => { const [x, y] = P(u); mark.current.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`); trail.current.setAttribute('d', upto(u)); };
    const step = () => { const now = clock(); t0 = t0 || now; const k = Math.min(1, Math.max(0, (now - t0 - 420) / 1300)); put(done * (1 - Math.pow(1 - k, 4))); if (k < 1) raf = requestAnimationFrame(step); };
    put(0); raf = requestAnimationFrame(step); return () => { cancelAnimationFrame(raf); put(done); };
  }, []);
  return <section className="goal card">
    <div className="g-h"><div className="n g-n"><Count v={now} fmt={mmss} /></div><div className="g-gap"><span className="n"><Count v={Math.max(0, now - goal.pb_secs)} fmt={mmss} /></span> to find</div><div className="n g-n">{t(goal.pb_secs)}</div></div>
    <svg viewBox="0 -14 350 82" role="img" aria-label={`5K goal: ${t(now)} now, ${t(goal.pb_secs)} personal best`}>
      {[10, 26, 42, 58].map((y) => <line key={y} x1="0" x2="350" y1={y} y2={y} stroke="#23261F" />)}
      <path d={path} fill="none" stroke="#F2F1E8" strokeWidth="2" strokeDasharray="1 7" strokeLinecap="round" />
      {done > 0.02 && <path ref={trail} d={upto(done)} fill="none" stroke="#E1FF45" strokeWidth="2.6" strokeLinecap="round" />}
      {done > 0.02 && <circle cx="8" cy="10" r="4" fill="#0D0E0C" stroke="#74766A" strokeWidth="2" />}
      <circle cx="318" cy="58" r="6" fill="#0D0E0C" stroke="#F2F1E8" strokeWidth="2" />
      <g ref={mark} transform={`translate(${mx.toFixed(1)} ${my.toFixed(1)})`}><circle className="pulse" r="11" fill="#E1FF45" /><circle r="13" fill="none" stroke="#E1FF45" strokeOpacity=".3" /><circle r="7" fill="#E1FF45" />
        <text x={mx > 200 ? -20 : 4} y="-19" textAnchor={mx > 200 ? 'end' : 'start'} fontSize="12" fill="#A3A394">{best.length ? 'best estimate' : 'starting point'}{done > 0.02 ? `, ${Math.round(done * 100)}% of the way back` : ''}</text></g>
      <text x="306" y="50" textAnchor="end" fontSize="12" fill="#A3A394">your PB</text>
    </svg>
  </section>;
}

function Knee({ knee, checkins }) {
  const last = [...(checkins || [])].sort((a, b) => a.date.localeCompare(b.date)).pop();
  return <section className="knee card">
    <div className="k-t"><b>Knee</b>{knee && knee.level !== 'unknown' ? <span className={`lv-${knee.level}`}>{knee.note}</span> : <span className="mute">{last ? `Last check-in ${last.pain} out of 10` : 'No check-in yet'}</span>}</div>
    <div className={`k-s ${last ? (last.pain < 3 ? 'at-a' : last.pain < 5 ? 'at-b' : 'at-c') : ''}`}><i className="a" /><i className="b" /><i className="c" />{last && <u style={{ left: `${((last.pain + 0.5) / 11) * 100}%` }} />}</div>
    <div className="k-l"><span>0 to 2<br />carry on</span><span>3 to 4<br />easy only</span><span>5 or more, or any swelling<br />stop</span></div>
  </section>;
}

// Today has three real states: a run day, a rest day, and a run already done. Each gets its own hero.
function RunHero({ s }) {
  const today = s.date === iso(), when = today ? (s.type === 'walk-run' ? 'Easy, with walk breaks' : s.type === 'easy' || s.type === 'long' ? 'Easy all the way' : '') : `${new Date(s.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long' })}, ${inDays(s.date)}`;
  return <section className="hero">
    <div className="h-row"><BigKm s={s} /><div className="h-t"><h2>{s.title}</h2>{when && <p>{when}</p>}</div></div>
    <SessionBody s={s} hot={today} fold />
  </section>;
}
function RestHero({ s }) {
  return <section className="hero rest-h">
    <div className="big long">REST<small>day</small></div>
    <h2>{s.title}</h2>{s.why && <p className="whyp">{s.why}</p>}
    <RestBody s={s} fold />
  </section>;
}
function Review({ review, onOpen }) {
  const n = (review.went_well || []).length, m = (review.work_on || []).length;
  return <><div className="said"><p>{review.headline}</p><span>Your coach</span></div>
    <a role="button" className="golink" onClick={onOpen}>Read the full review<span>{[n && `${n} went well`, m && `${m} to work on`].filter(Boolean).join(', ')}</span><i className="ph-bold ph-caret-right" /></a></>;
}
function DoneHero({ run, review, openRun }) {
  const sp = splitSecs(run);
  const lo = Math.min(...sp), hi = Math.max(...sp), mid = [...sp].sort((a, b) => a - b)[Math.floor(sp.length / 2)];
  return <section className="hero tap" onClick={() => openRun(run)}>
    <div className="done-t"><b><i className="ph-fill ph-check-circle" />Run done</b><span>{new Date(run.start || run.date + 'T12:00:00').toLocaleString('en-GB', run.start ? { weekday: 'short', hour: '2-digit', minute: '2-digit' } : { weekday: 'short', day: 'numeric' })}</span></div>
    <div className="h-row" style={{ justifyContent: 'space-between' }}><div className="big long"><Count v={+run.km} fmt={(x) => (Number.isInteger(+run.km) ? String(Math.round(x)) : x.toFixed(String(run.km).split('.')[1].length))} /><small>km</small></div>
      <div className="side"><div><b><Count v={run.secs} fmt={mmss} /></b><span>time</span></div><div><b><Count v={run.pace_s_per_km} fmt={mmss} /></b><span>per km</span></div></div></div>
    {sp.length > 1 && <div className="sp" role="img" aria-label="Kilometre splits, taller is faster, hatched is where you faded">{sp.map((x, i) => <div key={i} className={x > mid * 1.05 ? 'slow' : x === lo && hi !== lo ? 'fast' : ''}><u className="rise" style={{ '--i': i * 2, height: 14 + (hi === lo ? 14 : ((hi - x) / (hi - lo)) * 30) }} /><b>{t(x)}</b><span>km {i + 1}</span></div>)}</div>}
    {review ? <Review review={review} onOpen={() => {}} /> : <p className="whyp" style={{ marginTop: 16 }}>Check in on the knee and the coach will read this run.</p>}
  </section>;
}
function NextCard({ s, open }) {
  const r = readSession(s);
  return <section className="nx card tap" onClick={() => open(s)}><Tick />
    <div className="h4">Next run<span>{dayName(s.date)} {dayNum(s.date)}, {inDays(s.date)}</span></div>
    <div className="nx-r"><div className="d">{s.km != null ? kmLabel(s.km) : s.minutes}<small>{s.km != null ? 'km' : 'min'}</small></div>
      <div><h3>{s.title}</h3><p>{[s.minutes != null && `About ${s.minutes} min`, s.hr_cap != null && `under ${s.hr_cap} bpm`].filter(Boolean).join(', ')}</p></div><i className="ph-bold ph-caret-right" /></div>
    {r.steps.length > 0 && <Profile steps={r.steps} mini labels />}
  </section>;
}
// What Today shows, worked out once so the page and the pinned button agree.
function todayView(data) {
  const { coach, runs } = data, day = iso();
  const sessions = coach.plan ? (coach.plan.weeks || []).flatMap((w) => w.sessions || []) : [];
  const last = runs[runs.length - 1], ran = !!last && last.date === day, review = last && coach.reviews && coach.reviews[last.id];
  const now = sessions.find((s) => s.date === day) || null;
  const upcoming = sessions.find((s) => RUNNING(s) && (s.date > day || (s.date === day && !ran))) || null;
  const mode = !coach.plan ? (runs.length ? 'noplan' : 'first') : ran ? 'done' : now && !RUNNING(now) ? 'rest' : upcoming ? 'run' : 'noplan';
  const checked = !!last && (data.checkins || []).some((c) => c.runId === last.id);
  const cta = mode === 'first' ? 'first' : mode === 'noplan' ? 'plan' : mode === 'run' && upcoming.date === day ? 'add' : last && !checked ? 'knee' : mode === 'done' && !review ? 'review' : upcoming ? 'next' : 'runs';
  return { sessions, last, review, now, upcoming, mode, cta };
}

function Today({ data, reload, openRun, openSession, go }) {
  const { coach, runs, checkins } = data, v = todayView(data), { last, review, mode } = v;
  const [busy, setBusy] = useState(false), [err, setErr] = useState('');
  const plan = async () => { setBusy(true); setErr(''); try { await api('/api/coach', { method: 'POST', body: JSON.stringify({ action: 'plan' }) }); await reload(); } catch (e) { setErr(e.message); } setBusy(false); };
  const marks = new Set([...v.sessions.filter(RUNNING).map((s) => s.date), ...runs.map((r) => r.date)]);
  return <div>
    <header className="top"><div><h1 data-lt>Today</h1><p className="sub">{new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' })}</p></div><WeekStrip marks={marks} /></header>
    {mode === 'done' && <DoneHero run={last} review={review} openRun={openRun} />}
    {mode === 'rest' && <RestHero s={v.now} />}
    {mode === 'run' && <RunHero s={v.upcoming} />}
    {mode === 'noplan' && <section className="hero"><h2>No plan yet</h2><p className="sub" style={{ fontSize: 14.5 }}>Your coach has your runs. Ask it for your first two weeks.</p></section>}
    {mode === 'first' && <section className="hero">
      <div className="h-row"><div className="big">5<small>km</small></div><div className="h-t"><h2>Benchmark run</h2><p>Do this first: a steady 5 km, comfortably hard, not a race. Walk if the knee hurts.</p></div></div>
      <Ramp lit={EFFORT.test} word="Hold it here" />
    </section>}
    {err && <p className="err">{err}</p>}
    <Knee knee={coach.knee} checkins={checkins} />
    {(mode === 'done' || mode === 'rest') && v.upcoming && <NextCard s={v.upcoming} open={openSession} />}

  const cad = M.find((m) => /cadence/i.test(m.name)), cv = cad && splitVal(cad.value), aim = cad && String(cad.ref || '').match(/(\d{2,3})\s*[–-]\s*(\d{2,3})/);
  return <div>
    <header className="top"><div><h1 data-lt>Form</h1><p className="sub">{f.date ? `From your walking-pad videos, ${f.date}` : 'From your walking-pad videos'}</p></div></header>
    {cv && <section className="hero"><div className="h-row"><div className="big long">{cv.pre}<Count v={cv.num} fmt={(x) => x.toFixed(cv.dec)} />{cv.sym}{cv.unit && <small>{cv.unit}</small>}</div>
      <div className="h-t"><h2>{cad.name}</h2>{cad.ref && <p>{cad.ref[0].toUpperCase() + cad.ref.slice(1)}{aim ? ' steps a minute' : ''}</p>}</div></div></section>}
    {(f.video || f.still) && <FormShot f={f} kv={kv} />}
    {first && <section className="cue1"><h2>{first.cue}</h2>{first.why && <p>{first.why}</p>}
      {cv && aim && <CadenceGauge now={cv.num} lo={+aim[1]} hi={+aim[2]} />}
      {first.feel && <p><b>What to feel: </b>{first.feel}</p>}</section>}
    {M.length > 0 && <section className="mgrid">{M.map((m, i) => { const v = splitVal(m.value), tone = metricTone(m.ref);
      return <div key={m.name} className={`st ${tone}`} style={{ '--i': i }}>
        {v ? <b>{v.pre}<Count v={v.num} fmt={(x) => x.toFixed(v.dec)} delay={200 + i * 40} />{v.sym}{v.unit && <small>{v.unit}</small>}</b> : <b className="word">{m.value}</b>}
        <span>{m.name}</span>{m.ref && <em>{tone === 'ok' ? <i className="ph-bold ph-check" /> : tone === 'work' ? <i className="ph-bold ph-target" /> : null}{m.ref}</em>}</div>; })}</section>}
    {cues.slice(1).length > 0 && <section className="cues card">{cues.slice(1).map((c, i) => <div className="cue" key={i}><h3>{c.cue}</h3>{c.why && <p>{c.why}</p>}{c.feel && <p className="feel"><i className="ph ph-hand-waving" /><span>{c.feel}</span></p>}</div>)}</section>}
    <p className="note">Measured from your video. Not a clinical gait analysis.</p>
  </div>;
}
// "161 spm" -> sign, number, symbol and unit, so the number can be set big and count up. Words ("even") are left alone.
const splitVal = (x) => { const m = String(x).match(/^([+\-−]?)(\d+(?:\.\d+)?)\s*(°|%)?\s*(.*)$/); return m ? { pre: m[1], num: +m[2], dec: (m[2].split('.')[1] || '').length, sym: m[3] || '', unit: m[4] } : null; };
// Colour comes from the coach's own note on each number: green when it reads as fine, yellow when there is a target to move towards.
const metricTone = (ref) => (/healthy|good|symmetrical|normal/i.test(ref || '') ? 'ok' : /\baim\b|lower is better|higher is better/i.test(ref || '') ? 'work' : '');

// The clip, edge to edge. Tap the button to pause; the strip of ticks shows where the loop is.
function FormShot({ f, kv }) {
  const vid = useRef(), head = useRef(), fill = useRef(), strip = useRef(), [paused, setPaused] = useState(REDUCE.matches);
  useEffect(() => {
    const v = vid.current; if (!v) return; let raf; v.playbackRate = Math.max(0.07, RATE);
    const loop = () => { const k = v.duration ? v.currentTime / v.duration : 0, w = strip.current ? strip.current.clientWidth : 0; if (head.current) { head.current.style.transform = `translate3d(${(k * w).toFixed(1)}px,0,0)`; fill.current.style.clipPath = `inset(0 ${((1 - k) * 100).toFixed(2)}% 0 0)`; } raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf);
  }, []);
  const toggle = () => { const v = vid.current; if (!v) return; buzz(6); if (v.paused) { v.play(); setPaused(false); } else { v.pause(); setPaused(true); } };
  return <div className="shot">
    {f.video ? <video ref={vid} src={f.video} poster={f.still || undefined} autoPlay={!REDUCE.matches} muted loop playsInline /> : <img src={f.still} alt="A frame of you running, with the skeleton drawn on" />}
    {kv && <div className="shot-m"><b>{kv.pre}<Count v={kv.num} fmt={(x) => x.toFixed(kv.dec)} delay={300} />{kv.sym}</b><span>knee bend at landing<small>your typical landing</small></span></div>}
    {f.video && <div className="shot-b"><button className="play" aria-label={paused ? 'Play the clip' : 'Pause the clip'} onClick={toggle}><Tick /><i className={`ph-fill ph-${paused ? 'play' : 'pause'}`} /></button></div>}
    {f.video && <div className="scrub" ref={strip} aria-hidden="true"><b ref={fill} /><i ref={head} /></div>}
  </div>;
}
// Where the cadence is now against the range to aim for, one tick per step a minute.
function CadenceGauge({ now, lo, hi }) {
  const a = Math.floor((Math.min(now, lo) - 9) / 5) * 5, b = Math.ceil((Math.max(now, hi) + 6) / 5) * 5, X = (v) => 4 + ((v - a) / (b - a)) * 342;
  return <svg className="gauge" viewBox="0 0 350 66" role="img" aria-label={`Cadence ${now} steps a minute now, aim for ${lo} to ${hi}`}>
    <rect className="fadein" x={X(lo)} y="22" width={X(hi) - X(lo)} height="26" rx="5" fill="rgba(225,255,69,.13)" stroke="rgba(225,255,69,.35)" />
    {Array.from({ length: b - a + 1 }, (_, i) => { const v = a + i, on = v >= lo && v <= hi, big = v % 5 === 0; return <line key={v} className="rise" style={{ '--i': i * 0.6 }} x1={X(v)} x2={X(v)} y1={big ? 26 : 31} y2="44" stroke={on ? '#E1FF45' : big ? '#A3A394' : '#4A4E40'} strokeWidth="1.6" strokeLinecap="round" />; })}
    <g className="st" style={{ '--i': 6 }}><line x1={X(now)} x2={X(now)} y1="18" y2="50" stroke="#F2F1E8" strokeWidth="2.6" strokeLinecap="round" /><circle cx={X(now)} cy="18" r="4.5" fill="#F2F1E8" />
      <text className="gn" x={X(now)} y="11" textAnchor="middle" fill="#F2F1E8">{now}</text><text x={X(now)} y="64" textAnchor="middle" fontSize="12" fill="#A3A394">now</text></g>
    <text className="gn" x={(X(lo) + X(hi)) / 2} y="11" textAnchor="middle" fill="#E1FF45">{lo}–{hi}</text><text x={(X(lo) + X(hi)) / 2} y="64" textAnchor="middle" fontSize="12" fill="#E1FF45">aim here</text>
  </svg>;
}

const TABS = [['today', 'sun-horizon', 'Today'], ['plan', 'calendar-dots', 'Plan'], ['runs', 'sneaker-move', 'Runs'], ['form', 'person-simple-run', 'Form']];
function View({ id, pinned, dir, children }) {
  const fresh = useFresh(id);
  return <main className={`page ${pinned ? 'has-cta' : ''} ${fresh ? 'fresh' : ''} ${dir ? 'enter' : ''}`}><Fresh.Provider value={fresh}>{children}</Fresh.Provider></main>;
}
const Skeleton = () => <main className="page" aria-busy="true" aria-label="Loading"><div className="sk" style={{ width: 120, height: 34 }} /><div className="sk" style={{ width: 230, height: 118, marginTop: 30 }} /><div className="sk" style={{ height: 50, marginTop: 24 }} /><div className="sk" style={{ height: 96, marginTop: 18, borderRadius: 22 }} /><div className="sk" style={{ height: 120, marginTop: 14, borderRadius: 22 }} /></main>;

function App() {
  const [hasKey, setHasKey] = useState(!!localStorage.getItem(KEY));
  const [tab, setTab] = useState('today'), [data, setData] = useState(null), [err, setErr] = useState(''), [run, setRun] = useState(null), [sess, setSess] = useState(null), [scrolled, setScrolled] = useState(false), moved = useRef(0);
  const load = async () => {
    try {
      const [r, c] = await Promise.all([api('/api/runs'), api('/api/coach')]);
      setData({ runs: r.runs, checkins: r.checkins, coach: c, goal: c.goal });
      if (run) setRun(r.runs.find((x) => x.id === run.id) || null);
      setErr('');
    } catch (e) { setErr(e.message); if (/wrong key/.test(e.message)) { localStorage.removeItem(KEY); setHasKey(false); } }
  };
  useEffect(() => { if (hasKey) load(); }, [hasKey]);
  // Changing tab: the page you leave slides out towards the side you came from, the new one arrives from the side you tapped.
  const go = (x) => {
    if (x === tab) { window.scrollTo({ top: 0, behavior: REDUCE.matches ? 'auto' : 'smooth' }); return; }
    const ix = (k) => TABS.findIndex((q) => q[0] === k), dir = ix(x) > ix(tab) ? 1 : -1; moved.current = dir;
    document.documentElement.style.setProperty('--dir', dir); buzz(6);
    const old = document.querySelector('main.page'), layer = document.getElementById('ghosts');
    if (old && layer && !REDUCE.matches) {
      const g = old.cloneNode(true); g.classList.remove('fresh', 'enter'); g.classList.add('leaving'); g.style.top = `${-window.scrollY}px`; g.setAttribute('aria-hidden', 'true'); layer.replaceChildren(g);
      g.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-22 * dir}px)` }], { duration: 150, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
    }
    ReactDOM.flushSync(() => { setTab(x); setScrolled(false); }); window.scrollTo(0, 0);
  };
  // The compact title shows once the large one has gone under the status bar.
  useEffect(() => {
    const el = document.querySelector('main.page:not(.leaving) [data-lt]'); if (!el || !window.IntersectionObserver) return;
    const io = new IntersectionObserver(([e]) => setScrolled(!e.isIntersecting), { rootMargin: '-52px 0px 0px 0px' }); io.observe(el); return () => io.disconnect();
  }, [tab, !!data]);
  if (!hasKey) return <Setup onDone={() => setHasKey(true)} />;
  if (!data) return <>{err ? <p className="mute" style={{ position: 'relative', paddingTop: '30vh', textAlign: 'center' }}>{err}</p> : <Skeleton />}</>;
  const v = todayView(data), pinned = (tab === 'today' && !!v.cta) || (tab === 'plan' && !data.coach.plan);
  const P = { data, reload: load, openRun: setRun, openSession: setSess, go };
  return <>
    <div id="ghosts" />
    <View key={tab} id={tab} pinned={pinned} dir={moved.current}>{tab === 'today' && <Today {...P} />}{tab === 'plan' && <Plan {...P} />}{tab === 'runs' && <Runs {...P} />}{tab === 'form' && <Form {...P} />}</View>
    <div className={`edge ${pinned ? 'tall' : ''}`} aria-hidden="true" />
    <div className={`bar ${scrolled ? 'on' : ''}`} aria-hidden="true"><b>{TABS.find((q) => q[0] === tab)[2]}</b></div>
    <nav className="tabs"><span className="pill" style={{ transform: `translateX(${TABS.findIndex((q) => q[0] === tab) * 100}%)` }} />{TABS.map(([x, icon, name]) => <a key={x} role="button" aria-current={tab === x ? 'page' : undefined} className={tab === x ? 'on' : ''} onClick={() => go(x)}><Tick /><i className={`${tab === x ? 'ph-fill' : 'ph'} ph-${icon}`} /><span>{name}</span></a>)}</nav>
    {run && <RunDetail run={run} {...P} close={() => setRun(null)} />}
    {sess && <SessionSheet s={sess} close={() => setSess(null)} />}
  </>;
}
// iOS only shows :active press states when the page has a touch listener.
document.addEventListener('touchstart', () => {}, { passive: true });
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
