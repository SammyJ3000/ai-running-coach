<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0E0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach">
  <title>Coach</title>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="root"></div>
  <div id="dock"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useContext, createContext } = React;

// ---- Motion and haptics (how the app moves; no data logic lives here) ----
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)');
// One clock for the hand-stepped animations. ?slow=0.1 runs them at a tenth speed, for checking motion frame by frame.
const RATE = +new URLSearchParams(location.search).get('slow') || 1, clock = () => performance.now() * RATE;
// iOS has no navigator.vibrate. The one haptic Safari gives a web page is the system tick of a switch toggled by a real finger
// (a scripted click stopped working in iOS 26.5), so <Tick /> lays an invisible label wired to a hidden switch over a control.
// Same idea as the ios-haptics library (MIT). It only fires on the tap itself: never after a wait, a timer or during a drag.
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || /[?&]tick\b/.test(location.search);
const Tick = () => (IOS ? <label className="tick" aria-hidden="true"><input type="checkbox" switch="" tabIndex={-1} onClick={(e) => e.stopPropagation()} /></label> : null);
// Android and anything else with the Vibration API. Does nothing on iPhone.
const buzz = (pattern = 8) => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch { /* blocked by a permissions policy: no haptic, nothing else to do */ } };

// Things animate in the first time you see them in a launch, not on every visit.
const SEEN = new Set(), Fresh = createContext(false);
function useFresh(key) { const r = useRef(null); if (r.current === null) r.current = !SEEN.has(key) && !REDUCE.matches; useEffect(() => { SEEN.add(key); }, [key]); return r.current; }
// A number that counts up to its value on first view. The text is set by hand so React never fights the animation.
function Count({ v, fmt = (x) => String(Math.round(x)), ms = 850, delay = 140 }) {
  const fresh = useContext(Fresh), el = useRef(), ran = useRef(false);
  useLayoutEffect(() => {
    const node = el.current, num = typeof v === 'number' && isFinite(v); node.textContent = num ? fmt(v) : v == null ? '–' : v;
    if (!fresh || ran.current || !num) return; ran.current = true;
    let raf, t0; node.textContent = fmt(0);
    const step = () => { const now = clock(); t0 = t0 || now; const k = Math.min(1, Math.max(0, (now - t0 - delay) / ms)); node.textContent = fmt(v * (1 - Math.pow(1 - k, 4))); if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => { cancelAnimationFrame(raf); node.textContent = fmt(v); };
  }, [v]);
  return <bdi ref={el} />;
}
const mmss = (x) => t(Math.round(x));
// A damped spring, stepped by hand so a drag can hand it the finger's speed and grab it back mid-flight.
function springTo(get, set, to, v0, zeta, k, done) {
  let x = get(), v = v0, last = clock(), raf; const c = 2 * zeta * Math.sqrt(k);
  const tick = () => {
    const now = clock(), dt = Math.min(0.034, (now - last) / 1000); last = now;
    for (let n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n, i = 0; i < n; i++) { v += (-k * (x - to) - c * v) * h; x += v * h; }
    if (Math.abs(x - to) < 0.5 && Math.abs(v) < 10) { set(to); done && done(); return; }
    set(x); raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
}
const rubber = (over, size) => (1 - 1 / ((over * 0.55) / size + 1)) * size;

// Bottom sheet. Rises on a spring (no bounce), follows the finger 1:1, and on release decides from where the flick is heading:
// past halfway or a quick flick down dismisses, anything else springs back. Dragging up past the top meets rubber-band resistance.
function Sheet({ onClose, children }) {
  const root = useRef(), panel = useRef(), scrim = useRef(), S = useRef({ y: 0, h: 1, stop: null, closing: false, drag: null }).current;
  const set = (y) => { S.y = y; if (!panel.current) return; const yy = y < 0 ? -rubber(-y, S.h) : y; panel.current.style.transform = `translate3d(0,${yy.toFixed(1)}px,0)`; scrim.current.style.opacity = Math.max(0, Math.min(1, 1 - yy / S.h)).toFixed(3); };
  const go = (to, v, zeta, k, done) => { if (S.stop) S.stop(); if (REDUCE.matches) { set(to); if (done) done(); return; } S.stop = springTo(() => S.y, set, to, v, zeta, k, done); };
  const close = (v) => { if (S.closing) return; S.closing = true; root.current.style.pointerEvents = 'none'; go(S.h, Math.max(typeof v === 'number' ? v : 0, 0), 1, 520, onClose); };
  useLayoutEffect(() => {
    S.h = panel.current.offsetHeight; set(S.h); go(0, 0, 1, 300);
    const doc = document.documentElement, was = doc.style.overflow; doc.style.overflow = 'hidden';
    const key = (e) => { if (e.key === 'Escape') close(); }; window.addEventListener('keydown', key);
    const el = panel.current;
    const begin = (y, handle) => { if (S.closing) return; S.drag = { y0: y, base: S.y, handle, on: false, pts: [[clock(), y]] }; };
    const move = (y, e) => {
      const d = S.drag; if (!d) return;
      if (!d.on) { const dy = y - d.y0; if (Math.abs(dy) < 6) return; if (d.handle || (dy > 0 && el.scrollTop <= 0)) { d.on = true; d.y0 = y; d.base = S.y; if (S.stop) S.stop(); } else { S.drag = null; return; } }
      if (e && e.cancelable) e.preventDefault();
      d.pts.push([clock(), y]); if (d.pts.length > 6) d.pts.shift(); set(d.base + (y - d.y0));
    };
    const end = () => {
      const d = S.drag; S.drag = null; if (!d || !d.on) return;
      const a = d.pts[0], b = d.pts[d.pts.length - 1], v = b[0] > a[0] && clock() - b[0] < 90 ? ((b[1] - a[1]) / (b[0] - a[0])) * 1000 : 0;
      if (S.y + v * 0.2 > S.h * 0.5 || v > 800) { buzz(6); close(v); } else go(0, v, Math.abs(v) > 250 ? 0.82 : 1, 300, () => buzz(4));
    };
    const handle = (e) => !!e.target.closest('.grab, .sh-top');
    const ts = (e) => { if (e.touches.length === 1) begin(e.touches[0].clientY, handle(e)); }, tm = (e) => move(e.touches[0].clientY, e), te = () => end();
    el.addEventListener('touchstart', ts, { passive: true }); el.addEventListener('touchmove', tm, { passive: false }); el.addEventListener('touchend', te); el.addEventListener('touchcancel', te);
    const md = (e) => { if (e.pointerType !== 'mouse' || !handle(e)) return; begin(e.clientY, true); const mm = (ev) => move(ev.clientY, ev), mu = () => { window.removeEventListener('pointermove', mm); window.removeEventListener('pointerup', mu); end(); }; window.addEventListener('pointermove', mm); window.addEventListener('pointerup', mu); };
    el.addEventListener('pointerdown', md);
    return () => { if (S.stop) S.stop(); doc.style.overflow = was; window.removeEventListener('keydown', key); };
  }, []);
  return ReactDOM.createPortal(<div className="sheet" ref={root}><div className="scrim" ref={scrim} onClick={() => close()} />
    <div className="panel fresh" ref={panel} role="dialog" aria-modal="true"><div className="grab" /><Fresh.Provider value={!REDUCE.matches}>{children(close)}</Fresh.Provider></div></div>, document.body);
}
// The one pinned action. It lives outside the page so it stays put while pages change.
const Cta = ({ children, ...p }) => ReactDOM.createPortal(<button className={`cta ${p.busy ? 'busy' : ''}`} disabled={p.disabled} onClick={(e) => { buzz(10); p.onClick && p.onClick(e); }}><Tick />{children}</button>, document.getElementById('dock'));
const KEY = 'rc_key';

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-app-key': localStorage.getItem(KEY) || '', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || `error ${r.status}`);
  return j;
}
const t = (s) => (s == null ? '–' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`);
const pace = (s) => (s ? `${t(s)}/km` : '–');
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const dayName = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
const dayNum = (d) => new Date(d + 'T12:00:00').getDate();

function Setup({ onDone }) {
  const [k, setK] = useState('');
  return <main className="page"><div className="setup"><div className="n">COACH</div><p>Type the app's passphrase once. It stays on this phone.</p>
    <input type="password" value={k} onChange={(e) => setK(e.target.value)} placeholder="Passphrase" />
    <button onClick={() => { localStorage.setItem(KEY, k.trim()); onDone(); }}><Tick />Continue</button></div></main>;
}

// ---- Floodlit pieces (look only; no data logic lives here) ----
const RUNNING = (s) => s && !['rest', 'cross'].includes(s.type);
const HARD = /tempo|interval|test/;
// Where a session type sits on the 10-step effort ramp (which bars light up).
const EFFORT = { walk: [0, 1], 'walk-run': [1, 2], easy: [2, 3], long: [2, 3], strides: [3, 4], test: [5, 6], tempo: [6, 7], intervals: [7, 8] };
const kmLabel = (k) => (Number.isInteger(k) ? k : Math.round(k * 10) / 10);

// The coach writes a session as prose. These read it into steps, limits and notes for display; nothing is stored.
const sentences = (x) => String(x || '').replace(/([.!?])\s+(?=[A-Z])/g, '$1\n').split('\n').map((v) => v.trim()).filter(Boolean);
const STEP = /^(brisk walk|walk|easy run|run|jog)\s+(\d+(?:\.\d+)?)\s*min\b\s*(.*)$/i;
function readSession(s) {
  const steps = [], notes = []; let open = true;
  for (const raw of sentences(s.structure)) {
    if (open) {
      const body = raw.replace(/^then\s+/i, '').replace(/[.!]$/, '');
      const rep = body.match(/^(.*?),?\s*[x×]\s?(\d+)$/i), parts = rep ? rep[1].split(/,\s*/).map((p) => p.trim().match(STEP)) : [];
      if (rep && parts.length && parts.every(Boolean)) { steps.push({ reps: +rep[2], parts: parts.map((m) => ({ run: !/walk/i.test(m[1]), min: +m[2] })) }); continue; }
      const one = body.match(STEP);
      if (one) { steps.push({ reps: 1, parts: [{ run: !/walk/i.test(one[1]), min: +one[2] }] }); if (one[3] && !/^(to finish|easy)$/i.test(one[3])) notes.push(raw); continue; }
      if (steps.length) open = false;
    }
    notes.push(raw);
  }
  const range = String(s.pace || '').match(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/);
  return { steps, pre: notes.filter((n) => /^only\b/i.test(n)), notes: notes.filter((n) => !/^only\b/i.test(n)), cue: sentences(s.cue), range: range ? `${range[1]}–${range[2]}` : null };
}
const stepName = (g, cap) => { const w = (p) => `${p.run ? 'run' : 'walk'} ${p.min}`, x = g.reps > 1 ? `${g.reps} × ${g.parts.map(w).join(', ')}` : `${w(g.parts[0])}${cap ? ' min' : ''}`; return cap ? x[0].toUpperCase() + x.slice(1) : x; };
const stepLine = (steps) => { const x = steps.map((g) => stepName(g)).join(' · '); return x ? x[0].toUpperCase() + x.slice(1) : ''; };
const noteIcon = (n) => (/heart rate|bpm/i.test(n) ? 'heartbeat' : /^no running/i.test(n) ? 'prohibit' : /^gym/i.test(n) ? 'barbell' : /film|video/i.test(n) ? 'video-camera' : /pain|limp|knee|swelling|physio|sore/i.test(n) ? 'first-aid' : /walk/i.test(n) ? 'person-simple-walk' : /stop at|km on the watch/i.test(n) ? 'watch' : 'note');
const Line = ({ n, cls }) => { const m = n.match(/^(Gym|Note):\s*(.*)$/); return <div className={`${cls || ''} ${/^no running/i.test(n) ? 'no' : ''}`}><i className={`ph ph-${noteIcon(n)}`} /><span>{m ? <><b>{m[1]}. </b>{m[2][0].toUpperCase() + m[2].slice(1)}</> : n}</span></div>; };
const daysTo = (d) => Math.round((new Date(d + 'T12:00:00') - new Date(iso() + 'T12:00:00')) / 864e5);
const inDays = (d) => { const n = daysTo(d); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`; };

// Time runs left to right, height is effort: walk low, run high.
function Profile({ steps, hot, mini, labels }) {
  const flat = steps.flatMap((g) => Array.from({ length: g.reps }, () => g.parts).flat()), total = flat.reduce((n, p) => n + p.min, 0) || 1;
  const W = 350, H = mini ? 26 : 50, gap = flat.length > 12 ? 1.5 : 2.5, per = (W - gap * (flat.length - 1)) / total; let x = 0;
  return <div className="prof">
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Session shape: ${stepLine(steps)}`}>
      {(() => { const all = flat.map((p, i) => { const w = p.min * per, h = p.run ? H : H * 0.34, r = <rect key={i} className="rise" style={{ '--i': i }} x={x} y={H - h} width={w} height={h} rx={mini ? 2 : 3} fill={p.run ? 'var(--hi)' : '#3A3E33'} />; x += w + gap; return [p.run, r]; });
        return <><g>{all.filter((a) => !a[0]).map((a) => a[1])}</g><g>{all.filter((a) => a[0]).map((a) => a[1])}</g></>; })()}
    </svg>
    {labels && <div className="prof-l">{steps.length <= 4 ? steps.map((g, i) => <span key={i}>{g.reps > 1 || g.parts[0].run ? <b>{stepName(g, true)}</b> : stepName(g, true)}</span>) : <span>{stepLine(steps)}</span>}</div>}
  </div>;
}

// The body of a running session. `fold` keeps the small print behind a tap (Today); the sheet shows it all.
function SessionBody({ s, hot, fold }) {
  const r = readSession(s), [open, setOpen] = useState(false), lit = EFFORT[s.type];
  const cueRest = r.cue.slice(fold ? 2 : 0).join(' ');
  const rest = [...(cueRest ? [['cue', cueRest]] : []), ...(s.pace && (!r.range || !fold || /,/.test(s.pace)) ? [['pace', s.pace[0].toUpperCase() + s.pace.slice(1) + (/[.!]$/.test(s.pace) ? '' : '.')]] : []), ...r.notes.map((n) => ['note', n])];
  const list = <div className="lines">{rest.map(([k, n]) => k === 'cue' ? <div key={n}><i className="ph ph-metronome" /><span>{n}</span></div> : k === 'pace' ? <div key={n}><i className="ph ph-gauge" /><span>{n}</span></div> : <Line key={n} n={n} />)}</div>;
  const why = s.why && <p className="whyp"><b>Why this run. </b>{s.why}{s.rule && ' Adjusted by the knee rules.'}</p>;
  return <>
    {r.steps.length ? <Profile steps={r.steps} hot={hot} labels /> : lit && <Ramp lit={lit} word={HARD.test(s.type) ? 'Hold it here' : 'Stay down here'} />}
    <div className="stats">
      {s.minutes != null && <div><b><Count v={s.minutes} /><small>min</small></b><span>about, all in</span></div>}
      {s.hr_cap != null && <div><b><Count v={s.hr_cap} /><small>bpm</small></b><span>stay under</span></div>}
      {r.range && <div><b>{r.range}</b><span>per km, easy</span></div>}
    </div>
    {(r.pre.length > 0 || (fold && r.cue[0])) && <div className="lines">
      {r.pre.map((n) => <div className="pre" key={n}><i className="ph ph-warning" /><span>{n}</span></div>)}
      {fold && r.cue[0] && <div className="cue-l"><i className="ph ph-metronome" /><span><b>{r.cue[0]}</b>{r.cue[1] ? ` ${r.cue[1]}` : ''}</span></div>}
    </div>}
    {fold ? <>
      <a role="button" aria-expanded={open} className={`more ${open ? 'open' : ''}`} onClick={() => setOpen(!open)}>Session notes<span>{open ? '' : 'Rules, pace and why'}</span><i className="ph-bold ph-caret-down" /></a>
      <div className={`fold ${open ? 'open' : ''}`} aria-hidden={!open}><div>{list}{why}</div></div>
    </> : <>{list}{why}</>}
  </>;
}
const kmFmt = (k) => (x) => (Number.isInteger(kmLabel(k)) ? String(Math.round(x)) : x.toFixed(1));
const BigKm = ({ s }) => (s.km != null ? <div className={`big ${String(kmLabel(s.km)).length > 1 ? 'long' : ''}`}><Count v={kmLabel(s.km)} fmt={kmFmt(s.km)} /><small>km</small></div> : s.minutes ? <div className="big long"><Count v={s.minutes} /><small>min</small></div> : null);

function RestBody({ s, fold }) {
  const all = sentences(s.structure), [open, setOpen] = useState(false), head = fold ? all.slice(0, 3) : all, tail = fold ? all.slice(3) : [];
  return <>
    <div className="lines">{head.map((n) => <Line key={n} n={n} />)}</div>
    {tail.length > 0 && <>
      <a role="button" aria-expanded={open} className={`more ${open ? 'open' : ''}`} onClick={() => setOpen(!open)}>{tail.length} more note{tail.length > 1 ? 's' : ''}<i className="ph-bold ph-caret-down" /></a>
      <div className={`fold ${open ? 'open' : ''}`} aria-hidden={!open}><div><div className="lines">{tail.map((n) => <Line key={n} n={n} />)}</div></div></div>
    </>}
  </>;
}

function SessionSheet({ s, close }) {
  const run = RUNNING(s);
  return <Sheet onClose={close}>{(close) => <>
    <div className="sh-top"><span>{new Date(s.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}{s.date >= iso() ? `, ${inDays(s.date)}` : ''}</span><a className="close" onClick={close}>Close<i className="ph-bold ph-x" /></a></div>
    {run ? <section className="hero"><div className="h-row"><BigKm s={s} /><div className="h-t"><h2>{s.title}</h2></div></div><SessionBody s={s} hot={s.date === iso()} /></section>
      : <section className="hero rest-h"><h2 style={{ marginTop: 0 }}>{s.title}</h2>{s.why && <p className="whyp">{s.why}</p>}<RestBody s={s} /></section>}
  </>}</Sheet>;
}

function Ramp({ lit, word }) {
  const [a, b] = lit, mid = ((a + b + 1) / 2) * 35.3 - 2.9;
  return <div className="ramp">
    <svg viewBox="0 0 350 56" role="img" aria-label={`Effort: ${word}`}><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#161814" /><rect width="1.4" height="5" fill="#3A3E33" /></pattern></defs>
      {Array.from({ length: 10 }, (_, i) => { const h = 12 + i * 4.6; return <rect key={i} className="rise" style={{ '--i': i }} x={i * 35.3} y={54 - h} width="29.5" height={h} rx="3" fill={i >= a && i <= b ? 'var(--hi)' : i > b ? 'url(#hatch)' : '#3A3E33'} stroke={i > b ? '#3A3E33' : 'none'} />; })}</svg>
    <div className="ramp-l"><span>{a > 1 ? 'Easy' : ''}</span><span className="here" style={{ left: `${Math.max(14, Math.min(82, (mid / 350) * 100))}%` }}>{word}</span><span>{b < 8 ? 'Not today' : ''}</span></div>
  </div>;
}

function WeekStrip({ marks }) {
  const now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return iso(d); });
  return <div className="wk" aria-label="This week">{days.map((d) => <div key={d} className={d === iso() ? 'now' : d < iso() ? 'past' : ''}><b>{dayName(d)[0]}</b><span>{dayNum(d)}</span>{marks.has(d) && <em />}</div>)}</div>;
}

function Goal({ goal, runs, coach }) {
  const best = runs.map((r) => r.est_5k_secs).filter(Boolean);
  const now = best.length ? Math.min(...best.slice(-6)) : (coach && coach.plan && coach.plan.target_now_secs) || goal.start_secs;
  const span = goal.start_secs - goal.pb_secs, done = Math.max(0, Math.min(1, (goal.start_secs - now) / span));
  // The path from the starting point to the PB: quick gains first, slower near the PB. A shape, not a forecast.
  const P = (u) => [8 + 310 * u, 10 + 48 * (1 - Math.pow(1 - u, 2.1))];
  const path = Array.from({ length: 25 }, (_, i) => P(i / 24)).map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
  const [mx, my] = P(done), upto = (u) => Array.from({ length: 13 }, (_, i) => P((u * i) / 12)).map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
  // On first view the marker travels from the starting point to where you are now, leaving a lit line behind it.
  const fresh = useContext(Fresh), mark = useRef(), trail = useRef();
  useLayoutEffect(() => {

      <div><b>{run.hr_avg || '–'}</b><span>avg bpm</span></div><div><b>{run.hr_max || '–'}</b><span>max bpm</span></div><div><b>{run.cadence || '–'}</b><span>steps a minute</span></div></div>
    {hr.length > 4 ? <HrTrace hr={hr} splits={splits.length} /> : <p className="nodata"><i className="ph ph-heartbeat" />No heart-rate trace came with this run.</p>}
    {splits.length > 0 && <div className="splits">{splits.map((s, i) => <div key={i}><b>{splitText(s)}</b><span>km {i + 1}</span></div>)}</div>}
    <section className="rule">
      <div className="h4">How does the knee feel?<span className="sw">Swelling?<button className={sw ? '' : 'on'} onClick={() => setSw(false)}>No</button><button className={sw ? 'on' : ''} onClick={() => setSw(true)}>Yes</button></span></div>
      <div className="scale">{Array.from({ length: 11 }, (_, i) => <button key={i} aria-label={`Knee pain ${i} out of 10`} className={`${i < 3 ? 'a' : i < 5 ? 'b' : 'c'} ${pain === i ? 'on' : ''}`} onClick={() => { buzz(5); setPain(i); }}><Tick />{i}</button>)}</div>
      <p className="note" style={{ marginTop: 6 }}>0 is nothing, 10 is bad.</p>
    </section>
    <button className={busy ? 'busy' : ''} disabled={busy} onClick={() => { buzz(10); go(); }}><Tick />{busy ? 'Coach is reading your run…' : saved ? <><i className="ph-bold ph-check" />Saved. Your review is below</> : review ? 'Review again' : "Get the coach's review"}</button>
    {err && <p className="err">{err}</p>}
    {review && <section className="rev rule" ref={rev} style={{ scrollMarginTop: 30 }}>
      <div className="h4">Coach's review</div>
      <p className="head">{review.headline}</p>
      <dl>
        {(review.went_well || []).length > 0 && <div><dt>Went well</dt><dd>{review.went_well.map((x) => <p key={x}>{x}</p>)}</dd></div>}
        {(review.work_on || []).length > 0 && <div><dt>Work on</dt><dd>{review.work_on.map((x) => <p key={x}>{x}</p>)}</dd></div>}
        {review.knee && <div><dt>Knee</dt><dd>{review.knee}</dd></div>}
        {review.change && <div><dt>What changes</dt><dd style={{ color: 'var(--ink)' }}>{review.change}</dd></div>}
      </dl>
    </section>}
  </>}</Sheet>;
}

// The latest run, set the same way as Today's "run done": distance big, time and pace beside it, splits as bars.
function LatestRunHero({ run, openRun }) {
  const sp = splitSecs(run);
  const lo = Math.min(...sp), hi = Math.max(...sp), mid = [...sp].sort((a, b) => a - b)[Math.floor(sp.length / 2)];
  return <section className="hero tap" onClick={() => openRun(run)}><Tick />
    <div className="done-t" style={{ marginBottom: 14 }}><span style={{ color: 'var(--ink)', fontWeight: 600 }}>Last run</span><span>{new Date(run.start || run.date + 'T12:00:00').toLocaleString('en-GB', run.start ? { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' } : { weekday: 'short', day: 'numeric', month: 'short' })}</span></div>
    <div className="h-row" style={{ justifyContent: 'space-between' }}><div className="big long"><Count v={+run.km} fmt={(x) => (Number.isInteger(+run.km) ? String(Math.round(x)) : x.toFixed(String(run.km).split('.')[1].length))} /><small>km</small></div>
      <div className="side"><div><b><Count v={run.secs} fmt={mmss} /></b><span>time</span></div><div><b><Count v={run.pace_s_per_km} fmt={mmss} /></b><span>per km</span></div></div></div>
    {sp.length > 1 && <div className="sp" role="img" aria-label="Kilometre splits, taller is faster, hatched is where you faded">{sp.map((x, i) => <div key={i} className={x > mid * 1.05 ? 'slow' : x === lo && hi !== lo ? 'fast' : ''}><u className="rise" style={{ '--i': i * 2, height: 14 + (hi === lo ? 14 : ((hi - x) / (hi - lo)) * 30) }} /><b>{t(x)}</b><span>km {i + 1}</span></div>)}</div>}
    <a role="button" className="golink" style={{ marginTop: 16, paddingTop: 13, borderTop: '1px solid var(--line)' }}>Open the run<span>{[run.hr_avg && `${run.hr_avg} bpm`, 'knee check-in and review'].filter(Boolean).join(', ')}</span><i className="ph-bold ph-caret-right" /></a>
  </section>;
}

function Runs({ data, openRun, reload }) {
  const [add, setAdd] = useState(false), [f, setF] = useState({ date: iso(), km: '', minutes: '' }), [err, setErr] = useState('');
  const save = async (close) => { setErr(''); try { await api('/api/runs', { method: 'POST', body: JSON.stringify({ run: f }) }); buzz([10, 50, 16]); close(); await reload(); } catch (e) { setErr(e.message); buzz([30, 60, 30]); } };
  const [reading, setReading] = useState(false);
  const readShot = (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    img.onload = async () => {   // shrink to 1600 px tall so the upload stays small
      const k = Math.min(1, 1600 / img.height), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      setReading(true); setErr('');
      try { await api('/api/coach', { method: 'POST', body: JSON.stringify({ action: 'read', image: c.toDataURL('image/jpeg', 0.85) }) }); await reload(); } catch (er) { setErr(er.message); }
      setReading(false);
    };
    fr.readAsDataURL(file);
  };
  const none = data.runs.length === 0, list = [...data.runs].reverse(), latest = list[0], older = list.slice(1);
  return <div>
    <header className="top"><div><h1 data-lt>Runs</h1><p className="sub">They arrive from your watch when you close its phone app.</p></div></header>
    {none && <section className="empty">
      <svg className="ghosted" viewBox="0 0 350 60" aria-hidden="true"><path d="M0 50 C40 50 50 22 90 20 S150 16 200 14 S300 12 350 10" fill="none" stroke="#3A3E33" strokeWidth="2" strokeDasharray="1 7" strokeLinecap="round" /><line x1="0" x2="350" y1="56" y2="56" stroke="#2B2E26" /></svg>
      <h2>No runs yet</h2><p>Start a workout on the watch (Outdoor Running), then close the watch's phone app. If it doesn't arrive, add it below.</p>
    </section>}
    {latest && <LatestRunHero run={latest} openRun={openRun} />}
    {older.length > 0 && <div className="h4" style={{ marginTop: 26 }}>Earlier runs<span>{older.length}</span></div>}
    {older.map((r, i) => <div className="runrow tap st" style={{ '--i': i }} key={r.id} onClick={() => openRun(r)}><Tick />
      <div className="d">{r.km}<small>km</small></div>
      <div><h3>{dayName(r.date)} {dayNum(r.date)}</h3><p>{[t(r.secs), pace(r.pace_s_per_km), r.hr_avg ? `${r.hr_avg} bpm` : null].filter(Boolean).join(', ')}</p></div>
      {(() => { const sp = splitSecs(r); if (sp.length < 2) return <i className="ph-bold ph-caret-right" />; const lo = Math.min(...sp), hi = Math.max(...sp);
        return <div className="mini" aria-hidden="true">{sp.map((x, k) => <u key={k} className="rise" style={{ '--i': k * 2 + 6, height: 8 + (hi === lo ? 10 : ((hi - x) / (hi - lo)) * 20) }} />)}</div>; })()}
    </div>)}
    <div style={{ marginTop: 20 }}>
      <label className={`btn ${none ? '' : 'ghost'} ${reading ? 'busy' : ''}`}><i className="ph ph-image" />{reading ? 'Coach is reading it…' : 'Upload a screenshot of the run'}
        <input type="file" accept="image/*" style={{ display: 'none' }} onChange={readShot} /></label>
      <button className="ghost" onClick={() => setAdd(true)}><i className="ph ph-pencil-simple-line" />Add a run by hand</button>
    </div>
    {err && !add && <p className="err">{err}</p>}
    {add && <Sheet onClose={() => setAdd(false)}>{(close) => <>
      <div className="sh-top"><h2 style={{ color: 'var(--ink)' }}>Add a run</h2><a className="close" onClick={close}>Close<i className="ph-bold ph-x" /></a></div>
      <label>Date<input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></label>
      <label>Distance (km)<input inputMode="decimal" value={f.km} onChange={(e) => setF({ ...f, km: e.target.value })} /></label>
      <label>Time (minutes, e.g. 27.5)<input inputMode="decimal" value={f.minutes} onChange={(e) => setF({ ...f, minutes: e.target.value })} /></label>
      <button onClick={() => save(close)}><Tick />Save run</button>{err && <p className="err">{err}</p>}
    </>}</Sheet>}
  </div>;
}

function Form({ data }) {
  const f = data.coach.form;
  if (!f) return <div>
    <header className="top"><h1 data-lt>Form</h1></header>
    <section className="empty">
      <svg className="ghosted" viewBox="0 0 350 150" aria-hidden="true"><g fill="none" stroke="#4A4E40" strokeWidth="2.5" strokeLinecap="round" strokeDasharray="1 7"><path d="M176 20 L170 70 L150 104 L146 138 M170 70 L196 102 L214 132 M176 26 L196 50 L186 60 M176 26 L160 52" /></g><circle cx="178" cy="10" r="7" fill="none" stroke="#4A4E40" strokeWidth="2" /><line x1="0" x2="350" y1="146" y2="146" stroke="#2B2E26" /></svg>
      <h2>No form analysis yet</h2><p>Your form analysis appears here once the walking-pad videos are processed: the skeleton on you, the numbers, and one thing to work on.</p>
    </section>
  </div>;
  const cues = f.cues || [], first = cues[0], M = f.metrics || [];
  const knee = M.find((m) => /knee bend at landing/i.test(m.name)), kv = knee && splitVal(knee.value);
  const cad = M.find((m) => /cadence/i.test(m.name)), cv = cad && splitVal(cad.value), aim = cad && String(cad.ref || '').match(/(\d{2,3})\s*[–-]\s*(\d{2,3})/);
  return <div>
    <header className="top"><div><h1 data-lt>Form</h1><p className="sub">{f.date ? `From your walking-pad videos, ${f.date}` : 'From your walking-pad videos'}</p></div></header>
    {cv && <section className="hero"><div className="h-row"><div className="big long">{cv.pre}<Count v={cv.num} fmt={(x) => x.toFixed(cv.dec)} />{cv.sym}{cv.unit && <small>{cv.unit}</small>}</div>
      <div className="h-t"><h2>{cad.name}</h2>{cad.ref && <p>{cad.ref[0].toUpperCase() + cad.ref.slice(1)}{aim ? ' steps a minute' : ''}</p>}</div></div></section>}
    {(f.video || f.still) && <FormShot f={f} kv={kv} />}
    {first && <section className="cue1"><h2>{first.cue}</h2>{first.why && <p>{first.why}</p>}
      {cv && aim && <CadenceGauge now={cv.num} lo={+aim[1]} hi={+aim[2]} />}
      {first.feel && <p><b>What to feel: </b>{first.feel}</p>}</section>}
    {M.length > 0 && <section className="mgrid">{M.map((m, i) => { const v = splitVal(m.value), tone = metricTone(m.ref);
      return <div key={m.name} className={`st ${tone}`} style={{ '--i': i }}>
        {v ? <b>{v.pre}<Count v={v.num} fmt={(x) => x.toFixed(v.dec)} delay={200 + i * 40} />{v.sym}{v.unit && <small>{v.unit}</small>}</b> : <b className="word">{m.value}</b>}
        <span>{m.name}</span>{m.ref && <em>{tone === 'ok' ? <i className="ph-bold ph-check" /> : tone === 'work' ? <i className="ph-bold ph-target" /> : null}{m.ref}</em>}</div>; })}</section>}
    {cues.slice(1).length > 0 && <section className="cues card">{cues.slice(1).map((c, i) => <div className="cue" key={i}><h3>{c.cue}</h3>{c.why && <p>{c.why}</p>}{c.feel && <p className="feel"><i className="ph ph-hand-waving" /><span>{c.feel}</span></p>}</div>)}</section>}
    <p className="note">Measured from your video. Not a clinical gait analysis.</p>
  </div>;
}
// "161 spm" -> sign, number, symbol and unit, so the number can be set big and count up. Words ("even") are left alone.
const splitVal = (x) => { const m = String(x).match(/^([+\-−]?)(\d+(?:\.\d+)?)\s*(°|%)?\s*(.*)$/); return m ? { pre: m[1], num: +m[2], dec: (m[2].split('.')[1] || '').length, sym: m[3] || '', unit: m[4] } : null; };
// Colour comes from the coach's own note on each number: green when it reads as fine, yellow when there is a target to move towards.
const metricTone = (ref) => (/healthy|good|symmetrical|normal/i.test(ref || '') ? 'ok' : /\baim\b|lower is better|higher is better/i.test(ref || '') ? 'work' : '');

// The clip, edge to edge. Tap the button to pause; the strip of ticks shows where the loop is.
function FormShot({ f, kv }) {
  const vid = useRef(), head = useRef(), fill = useRef(), strip = useRef(), [paused, setPaused] = useState(REDUCE.matches);
  useEffect(() => {
    const v = vid.current; if (!v) return; let raf; v.playbackRate = Math.max(0.07, RATE);
    const loop = () => { const k = v.duration ? v.currentTime / v.duration : 0, w = strip.current ? strip.current.clientWidth : 0; if (head.current) { head.current.style.transform = `translate3d(${(k * w).toFixed(1)}px,0,0)`; fill.current.style.clipPath = `inset(0 ${((1 - k) * 100).toFixed(2)}% 0 0)`; } raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf);
  }, []);
  const toggle = () => { const v = vid.current; if (!v) return; buzz(6); if (v.paused) { v.play(); setPaused(false); } else { v.pause(); setPaused(true); } };
  return <div className="shot">
    {f.video ? <video ref={vid} src={f.video} poster={f.still || undefined} autoPlay={!REDUCE.matches} muted loop playsInline /> : <img src={f.still} alt="A frame of you running, with the skeleton drawn on" />}
    {kv && <div className="shot-m"><b>{kv.pre}<Count v={kv.num} fmt={(x) => x.toFixed(kv.dec)} delay={300} />{kv.sym}</b><span>knee bend at landing<small>your typical landing</small></span></div>}
    {f.video && <div className="shot-b"><button className="play" aria-label={paused ? 'Play the clip' : 'Pause the clip'} onClick={toggle}><Tick /><i className={`ph-fill ph-${paused ? 'play' : 'pause'}`} /></button></div>}
    {f.video && <div className="scrub" ref={strip} aria-hidden="true"><b ref={fill} /><i ref={head} /></div>}
  </div>;
}
// Where the cadence is now against the range to aim for, one tick per step a minute.
function CadenceGauge({ now, lo, hi }) {
  const a = Math.floor((Math.min(now, lo) - 9) / 5) * 5, b = Math.ceil((Math.max(now, hi) + 6) / 5) * 5, X = (v) => 4 + ((v - a) / (b - a)) * 342;
  return <svg className="gauge" viewBox="0 0 350 66" role="img" aria-label={`Cadence ${now} steps a minute now, aim for ${lo} to ${hi}`}>
    <rect className="fadein" x={X(lo)} y="22" width={X(hi) - X(lo)} height="26" rx="5" fill="rgba(225,255,69,.13)" stroke="rgba(225,255,69,.35)" />
    {Array.from({ length: b - a + 1 }, (_, i) => { const v = a + i, on = v >= lo && v <= hi, big = v % 5 === 0; return <line key={v} className="rise" style={{ '--i': i * 0.6 }} x1={X(v)} x2={X(v)} y1={big ? 26 : 31} y2="44" stroke={on ? '#E1FF45' : big ? '#A3A394' : '#4A4E40'} strokeWidth="1.6" strokeLinecap="round" />; })}
    <g className="st" style={{ '--i': 6 }}><line x1={X(now)} x2={X(now)} y1="18" y2="50" stroke="#F2F1E8" strokeWidth="2.6" strokeLinecap="round" /><circle cx={X(now)} cy="18" r="4.5" fill="#F2F1E8" />
      <text className="gn" x={X(now)} y="11" textAnchor="middle" fill="#F2F1E8">{now}</text><text x={X(now)} y="64" textAnchor="middle" fontSize="12" fill="#A3A394">now</text></g>
    <text className="gn" x={(X(lo) + X(hi)) / 2} y="11" textAnchor="middle" fill="#E1FF45">{lo}–{hi}</text><text x={(X(lo) + X(hi)) / 2} y="64" textAnchor="middle" fontSize="12" fill="#E1FF45">aim here</text>
  </svg>;
}

const TABS = [['today', 'sun-horizon', 'Today'], ['plan', 'calendar-dots', 'Plan'], ['runs', 'sneaker-move', 'Runs'], ['form', 'person-simple-run', 'Form']];
function View({ id, pinned, dir, children }) {
  const fresh = useFresh(id);
  return <main className={`page ${pinned ? 'has-cta' : ''} ${fresh ? 'fresh' : ''} ${dir ? 'enter' : ''}`}><Fresh.Provider value={fresh}>{children}</Fresh.Provider></main>;
}
const Skeleton = () => <main className="page" aria-busy="true" aria-label="Loading"><div className="sk" style={{ width: 120, height: 34 }} /><div className="sk" style={{ width: 230, height: 118, marginTop: 30 }} /><div className="sk" style={{ height: 50, marginTop: 24 }} /><div className="sk" style={{ height: 96, marginTop: 18, borderRadius: 22 }} /><div className="sk" style={{ height: 120, marginTop: 14, borderRadius: 22 }} /></main>;

function App() {
  const [hasKey, setHasKey] = useState(!!localStorage.getItem(KEY));
  const [tab, setTab] = useState('today'), [data, setData] = useState(null), [err, setErr] = useState(''), [run, setRun] = useState(null), [sess, setSess] = useState(null), [scrolled, setScrolled] = useState(false), moved = useRef(0);
  const load = async () => {
    try {
      const [r, c] = await Promise.all([api('/api/runs'), api('/api/coach')]);
      setData({ runs: r.runs, checkins: r.checkins, coach: c, goal: c.goal });
      if (run) setRun(r.runs.find((x) => x.id === run.id) || null);
      setErr('');
    } catch (e) { setErr(e.message); if (/wrong key/.test(e.message)) { localStorage.removeItem(KEY); setHasKey(false); } }
  };
  useEffect(() => { if (hasKey) load(); }, [hasKey]);
  // Changing tab: the page you leave slides out towards the side you came from, the new one arrives from the side you tapped.
  const go = (x) => {
    if (x === tab) { window.scrollTo({ top: 0, behavior: REDUCE.matches ? 'auto' : 'smooth' }); return; }
    const ix = (k) => TABS.findIndex((q) => q[0] === k), dir = ix(x) > ix(tab) ? 1 : -1; moved.current = dir;
    document.documentElement.style.setProperty('--dir', dir); buzz(6);
    const old = document.querySelector('main.page'), layer = document.getElementById('ghosts');
    if (old && layer && !REDUCE.matches) {
      const g = old.cloneNode(true); g.classList.remove('fresh', 'enter'); g.classList.add('leaving'); g.style.top = `${-window.scrollY}px`; g.setAttribute('aria-hidden', 'true'); layer.replaceChildren(g);
      g.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-22 * dir}px)` }], { duration: 150, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
    }
    ReactDOM.flushSync(() => { setTab(x); setScrolled(false); }); window.scrollTo(0, 0);
  };
  // The compact title shows once the large one has gone under the status bar.
  useEffect(() => {
    const el = document.querySelector('main.page:not(.leaving) [data-lt]'); if (!el || !window.IntersectionObserver) return;
    const io = new IntersectionObserver(([e]) => setScrolled(!e.isIntersecting), { rootMargin: '-52px 0px 0px 0px' }); io.observe(el); return () => io.disconnect();
  }, [tab, !!data]);
  if (!hasKey) return <Setup onDone={() => setHasKey(true)} />;
  if (!data) return <>{err ? <p className="mute" style={{ position: 'relative', paddingTop: '30vh', textAlign: 'center' }}>{err}</p> : <Skeleton />}</>;
  const v = todayView(data), pinned = (tab === 'today' && !!v.cta) || (tab === 'plan' && !data.coach.plan);
  const P = { data, reload: load, openRun: setRun, openSession: setSess, go };
  return <>
    <div id="ghosts" />
    <View key={tab} id={tab} pinned={pinned} dir={moved.current}>{tab === 'today' && <Today {...P} />}{tab === 'plan' && <Plan {...P} />}{tab === 'runs' && <Runs {...P} />}{tab === 'form' && <Form {...P} />}</View>
    <div className={`edge ${pinned ? 'tall' : ''}`} aria-hidden="true" />
    <div className={`bar ${scrolled ? 'on' : ''}`} aria-hidden="true"><b>{TABS.find((q) => q[0] === tab)[2]}</b></div>
    <nav className="tabs"><span className="pill" style={{ transform: `translateX(${TABS.findIndex((q) => q[0] === tab) * 100}%)` }} />{TABS.map(([x, icon, name]) => <a key={x} role="button" aria-current={tab === x ? 'page' : undefined} className={tab === x ? 'on' : ''} onClick={() => go(x)}><Tick /><i className={`${tab === x ? 'ph-fill' : 'ph'} ph-${icon}`} /><span>{name}</span></a>)}</nav>
    {run && <RunDetail run={run} {...P} close={() => setRun(null)} />}
    {sess && <SessionSheet s={sess} close={() => setSess(null)} />}
  </>;
}
// iOS only shows :active press states when the page has a touch listener.
document.addEventListener('touchstart', () => {}, { passive: true });
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
